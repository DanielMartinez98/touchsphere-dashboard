# ── The AI stack (Ollama + Kokoro TTS + Whisper STT + RVC conversion + ComfyUI) ─
# Run this on a machine that can afford the compute. The dashboard app talks to
# these containers over plain HTTP, so where they run is purely a decision —
# in .env, or per service under Settings → Devices, which is how one dashboard
# uses two such machines.
#
#   THE EASY WAY, on the machine that should do the work:
#     bash scripts/local-ai/install.sh --dashboard https://<the dashboard>
#   picks the biggest disk that isn't the system one, writes .env.ai (TS_AI_DATA,
#   the profile), starts everything below bound to that disk, downloads the
#   models, and registers the machine with the dashboard. Day to day:
#     scripts/local-ai/ai-stack.sh up | down | status | logs
#
#   Every bind mount below is under ${TS_AI_DATA:-.} — the repo checkout unless
#   .env.ai (or a .env beside this file) says otherwise — so multi-gigabyte
#   weights can live on a data drive while the checkout stays where it is.
#
#   BY HAND:
#   On the LLM machine (this file):
#     git clone <this repo> && cd touchsphere-dashboard
#     # put the voice model at ./rvc-models/miku/ (a .pth + optional .index)
#     docker compose -f docker-compose.voice.yml --profile cpu up -d --build
#     # …or, with an NVIDIA GPU + nvidia-container-toolkit installed:
#     docker compose -f docker-compose.voice.yml --profile gpu up -d --build
#
#   On the dashboard machine (.env):
#     KOKORO_URL=http://<llm-box-ip>:8880
#     WHISPER_URL=http://<llm-box-ip>:8000
#     RVC_URL=http://<llm-box-ip>:5050
#     COMFYUI_URL=http://<llm-box-ip>:8188
#     # then restart WITHOUT the local voice containers:
#     docker compose up -d --remove-orphans
#
# Exactly one profile (cpu or gpu) should be up at a time — both variants bind
# the same host ports. Likewise don't run docker-compose.yml's `local-voice`
# profile on the same box as this file: same container names, same ports. The GPU profile is the reason to bother: RVC conversion
# that takes seconds per sentence on CPU is near-instant on CUDA.
#
# NOTE: these ports carry no authentication — anyone on the LAN can synthesise
# audio or queue a render through them, and ComfyUI can additionally read and
# write files inside its own container. Fine for a home network or a tailnet;
# don't forward them past it.

services:
  # ── Ollama — the language model ───────────────────────────────────────────
  # The assistant, its tools, the guide writer, the prompt improver and the
  # vision model all speak to this. Models are pulled into ${TS_AI_DATA}/ollama
  # (scripts/local-ai/install.sh pulls the chat and vision ones; more with
  # `ai-stack.sh pull <model>`). Skip this service on a box that already runs
  # Ollama natively — it would fight it for :11434.
  ollama:
    image: ollama/ollama:latest
    container_name: touchsphere-ollama
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${TS_AI_DATA:-.}/ollama:/root/.ollama
    environment:
      # Keep a model loaded between turns; the dashboard's own calls send
      # keep_alive per request, this is the floor for anything else.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: touchsphere-ollama
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${TS_AI_DATA:-.}/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Kokoro — neural TTS (says the words) ──────────────────────────────────
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: touchsphere-kokoro
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "8880:8880"

  kokoro-gpu:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: touchsphere-kokoro
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Whisper — speech-to-text (hears the words) ────────────────────────────
  # Same image contract as the local variant in docker-compose.yml. On the
  # GPU profile it is worth pointing WHISPER_MODEL at a bigger model — e.g.
  # Systran/faster-distil-whisper-large-v3 — since on CUDA even that answers
  # a sentence in well under a second, and it mishears far less than `small`.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: touchsphere-whisper
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${TS_AI_DATA:-.}/whisper-models:/home/ubuntu/.cache/huggingface/hub

  whisper-gpu:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    container_name: touchsphere-whisper
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${TS_AI_DATA:-.}/whisper-models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── RVC — voice conversion (turns the words into Miku) ────────────────────
  # Same image contract as the local variant in docker-compose.yml; the voice
  # model lives on THIS host at ./rvc-models/<name>/.
  rvc:
    build:
      context: ./docker/rvc
      dockerfile: Dockerfile
    container_name: touchsphere-rvc
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ${TS_AI_DATA:-.}/rvc-models:/app/rvc_models

  rvc-gpu:
    build:
      context: ./docker/rvc
      dockerfile: Dockerfile.gpu
    container_name: touchsphere-rvc
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ${TS_AI_DATA:-.}/rvc-models:/app/rvc_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── ComfyUI — image generation ────────────────────────────────────────────
  # GPU ONLY, and deliberately so. There is no cpu-profile twin the way kokoro
  # and rvc have one: SDXL on a CPU is minutes per image, which isn't a slower
  # fallback, it's a hang. With no COMFYUI_URL set the dashboard simply doesn't
  # offer the generate_image tool — see server/src/routes/image-tools.ts.
  #
  # Checkpoints live on THIS host under ./comfy/models (same arrangement as
  # ./rvc-models): they're multi-gigabyte files that have no business in git or
  # in an image, and they survive a rebuild here.
  #
  #   mkdir -p comfy/models/checkpoints
  #   # drop a .safetensors in, e.g. SD 1.5 or an SDXL checkpoint
  #
  # Without a checkpoint ComfyUI starts fine and every render fails with
  # "value not in list: ckpt_name" — which the dashboard surfaces verbatim in
  # the frame rather than swallowing.
  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: touchsphere-comfyui
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      # Where the weights live. Overridable because they are now ~115 GB and the
      # checkout is inside OneDrive on a system drive with no room left: set
      # COMFY_MODELS_DIR in a .env beside this file (e.g. D:/touchsphere/comfy/models)
      # and the folder stays out of the sync client and off the boot drive.
      # (scripts/local-ai/install.sh writes COMFY_MODELS_DIR into .env.ai beside
      # TS_AI_DATA, so both spellings land on the same disk.)
      - ${COMFY_MODELS_DIR:-./comfy/models}:/root/ComfyUI/models
      - ${TS_AI_DATA:-.}/comfy/output:/root/ComfyUI/output
      - ${TS_AI_DATA:-.}/comfy/input:/root/ComfyUI/input
      # NOTE: custom_nodes is deliberately NOT mounted. Bind-mounting an empty
      # host directory over it would hide whatever the image ships there — the
      # manager included — and the failure looks like ComfyUI simply forgetting
      # its own nodes. Install custom nodes inside the container, or add the
      # mount only once you have a directory whose contents you actually want.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
