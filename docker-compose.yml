services:
  # ── TouchSphere dashboard (internal only — Caddy proxies it) ──────────────
  app:
    # Must match what .github/workflows/docker-publish.yml publishes:
    # ghcr.io/<github owner, lowercased>/touchsphere-dashboard. It said `mmdan`
    # for months, which nothing publishes to, so Watchtower polled a 403 and
    # every deploy was a manual rebuild on the box.
    image: ghcr.io/danielmartinez98/touchsphere-dashboard:latest
    # Allow building the image locally from the repo's Dockerfile (e.g. on the
    # server) instead of pulling the prebuilt image from GHCR. Run:
    #   docker compose build app && docker compose up -d app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lets the Debug tab report exactly which commit is running. Compose
        # can't shell out, so export it when building locally:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose build app
        # Left empty it reports "unknown" and the update check falls back to
        # comparing the image's build time against the newest commit, which
        # still answers "am I out of date?" correctly.
        GIT_SHA: ${GIT_SHA:-}
    container_name: touchsphere
    restart: on-failure
    # Expose the Node app directly on the host so it's reachable at
    # http://<server-ip>:3001 (and http://localhost:3001 on the Pi itself).
    ports:
      - "3001:3001"
    env_file:
      - .env             # put your real secrets here (never committed)
    environment:
      NODE_ENV: production
      # Neural TTS + voice conversion (Miku's pipeline). These default to the
      # sibling containers below, but the app only ever talks HTTP — so on a box
      # too slow for the conversion, set KOKORO_URL / RVC_URL in .env to a
      # beefier machine (e.g. the one running Ollama) and run
      # docker-compose.voice.yml THERE instead. See that file for the steps.
      KOKORO_URL: ${KOKORO_URL:-http://kokoro:8880}
      RVC_URL: ${RVC_URL:-http://rvc:5050}
      # Local speech-to-text (the `whisper` service below, or the same image on
      # the GPU box via docker-compose.voice.yml). Tried BEFORE ElevenLabs
      # Scribe, which becomes the fallback; with neither, voice input is off.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
      # ComfyUI image generation. NO default, unlike the two above: there is no
      # local-voice-style sibling container to fall back to, because SDXL on this
      # box's CPU is minutes per image. Unset = the assistant is simply never
      # offered the generate_image tool, which is the honest outcome — there is
      # no espeak for pictures. Point it at the GPU box (docker-compose.voice.yml
      # runs ComfyUI there under the same `gpu` profile as Kokoro and RVC):
      #   COMFYUI_URL=http://<gpu-box-ip>:8188
      COMFYUI_URL: ${COMFYUI_URL:-}
    volumes:
      - touchsphere-cache:/data/cache   # persist cache across restarts
      # Avatar assets (Live2D model + Cubism runtime). Licensed files that are
      # deliberately kept out of git and out of the image, so they're mounted
      # from the host — drop them in ./avatar next to this file. Optional: with
      # no ./avatar directory the dashboard just shows the particle sphere.
      - ./avatar:/data/avatar:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # ── SearXNG — the assistant's own web search ──────────────────────────────
  # A metasearch engine (Google, Brave, DuckDuckGo… behind one JSON endpoint)
  # that needs no key and has no quota. It exists because Ollama's hosted
  # web_search has an HOURLY limit, and one game guide's research plus a
  # morning of "pull up a page about X" reaches it — after which every search
  # answered 429 and the assistant said "I hit a snag" to everything. With
  # SEARXNG_URL set (see .env.example) the server falls back here the moment
  # the hosted quota is gone, and uses it outright when there is no key.
  # Not exposed to the host — only the app talks to it, over the compose network.
  searxng:
    image: searxng/searxng:latest
    container_name: touchsphere-searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # SearXNG signs its own cookies with this; anything non-default will do
      # for an instance nothing but the app can reach.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-touchsphere-searxng-local}
      SEARXNG_BASE_URL: http://searxng:8080/

  # ── Kokoro — local neural TTS ─────────────────────────────────────────────
  # Runs the 82M-param Kokoro model on CPU and speaks OpenAI's
  # /v1/audio/speech dialect. This is what makes the assistants' voices work
  # with no API key, no per-word billing, and no internet connection.
  # Not exposed to the host — only the app talks to it, over the compose network.
  #
  # OPT-IN via the local-voice profile:
  #   docker compose --profile local-voice up -d
  # Skip the profile when the voice pipeline runs on another machine
  # (docker-compose.voice.yml + KOKORO_URL/RVC_URL in .env) — this box then
  # doesn't spend a core on synthesis it isn't doing.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: touchsphere-kokoro
    profiles: ["local-voice"]
    restart: unless-stopped
    expose:
      - "8880"

  # ── Whisper — local speech-to-text ────────────────────────────────────────
  # The listening half of the voice loop, on this box. Until this existed the
  # dashboard could speak without the internet (Kokoro, espeak) but could not
  # HEAR without it: /api/stt was ElevenLabs Scribe or nothing. speaches wraps
  # faster-whisper in OpenAI's /v1/audio/transcriptions API — the same shape
  # Kokoro uses for speech — and the app talks to it exactly as it would to
  # any other server speaking that dialect (faster-whisper-server, LocalAI,
  # whisper.cpp's server with --convert and WHISPER_PATH=/inference).
  #
  # The model named by WHISPER_MODEL (default Systran/faster-whisper-small,
  # ~500 MB) is downloaded on first use into the volume below and kept, so the
  # download happens once; the app sends a second of silence 15 s after boot
  # to make that first load happen while nobody is talking. `small` is the
  # right size for a 4-core CPU box (a sentence in ~1–2 s once warm); a GPU
  # box can run distil-large-v3 through docker-compose.voice.yml instead.
  # Published for amd64 AND arm64, so it also runs on the Pi. Same
  # local-voice profile as kokoro: opt in with
  #   docker compose --profile local-voice up -d
  # Not exposed to the host — only the app talks to it, over the compose network.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: touchsphere-whisper
    profiles: ["local-voice"]
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

  # ── RVC — local voice conversion (Miku's voice) ───────────────────────────
  # Second half of Miku's pipeline: Kokoro speaks the words, this re-timbres them
  # into her character voice. Entirely local — no key, no billing, works offline.
  # Same local-voice profile as kokoro above; they only make sense together.
  #
  # Drop the voice model on the host at ./rvc-models/miku/ (a .pth, plus an
  # optional .index). Free Miku RVC models are on Hugging Face. Without a model
  # the conversion fails and Miku falls back to a normal voice — she still talks.
  rvc:
    build:
      context: ./docker/rvc
      dockerfile: Dockerfile
    container_name: touchsphere-rvc
    profiles: ["local-voice"]
    restart: unless-stopped
    expose:
      - "5050"
    volumes:
      - ./rvc-models:/app/rvc_models

  # ── Caddy — HTTPS reverse proxy ───────────────────────────────────────────
  # Caddy uses its own internal CA to issue a self-signed TLS certificate.
  # This makes the app a "secure context" so mediaDevices / SpeechRecognition
  # work when accessed from a Pi over the LAN.
  #
  # First-time setup on the Pi (one-off, run after first `docker compose up`):
  #   scp user@SERVER_IP:/data/caddy-data/caddy/pki/authorities/local/root.crt /tmp/ts-root.crt
  #   sudo cp /tmp/ts-root.crt /usr/local/share/ca-certificates/touchsphere-caddy.crt
  #   sudo update-ca-certificates
  caddy:
    image: caddy:2-alpine
    container_name: touchsphere-caddy
    restart: unless-stopped
    ports:
      - "443:443"   # HTTPS — use https://SERVER_IP from TouchKio on the Pi
      - "80:80"     # HTTP → HTTPS redirect
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # ── Watchtower — auto-pulls new image when GitHub Actions publishes one ────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      # WATCHTOWER_NOTIFICATION_URL: "slack://TOKEN@CHANNEL"
    command: touchsphere

volumes:
  touchsphere-cache:
  whisper-models:  # downloaded Whisper weights — a one-time fetch, kept across restarts
  caddy-data:     # Caddy stores its CA and certs here — persist across restarts
  caddy-config:
